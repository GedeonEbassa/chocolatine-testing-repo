name: Chocolatine

on:
  push:
    branches-ignore:
      - 'no-ga/**'
  pull_request:
    branches-ignore:
      - 'no-ga/**'

env:
  MIRROR_SSH_URL: 'git@github.com:EpitechPGE1-2025/G-PSU-200-COT-2-2-minishell2-36.git'
  EXECUTABLES: 'mysh'

jobs:
  check_compilation_and_coding_style:
    if: github.repository != 'EpitechPGE1-2025/G-PSU-200-COT-2-2-minishell2-36'
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run coding style checker
        run: banana-check-repo .

      - name: Check compilation
        run: make
        env:
          CC: epiclang
        timeout-minutes: 2

      - name: Clean build
        run: make clean

      - name: Verify executables
        run: |
          IFS=',' read -ra EXECS <<< "$EXECUTABLES"
          for exec in "${EXECS[@]}"; do
            if [ ! -x "$exec" ]; then
              echo "::error file=$exec,title=Executable missing or not executable::$exec is missing or lacks execute permissions"
              exit 1
            fi
          done

  run_tests:
    needs: check_compilation_and_coding_style
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: make tests_run
        timeout-minutes: 2

  push_to_mirror:
    needs: run_tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_SSH_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}